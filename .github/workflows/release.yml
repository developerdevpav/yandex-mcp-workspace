name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without v prefix (for example 1.2.3-rc.1)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${DISPATCH_VERSION}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must be SemVer-like: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Set Maven release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: mvn -B versions:set -DnewVersion="${RELEASE_VERSION}" -DgenerateBackupPoms=false

      - name: Test and build release JARs
        run: mvn -B verify

      - name: Prepare JAR artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/release-jars/input dist/release-jars/assets
          cp "yandex-mcp-workspace-tracker/target/yandex-mcp-workspace-tracker-${RELEASE_VERSION}.jar" \
            dist/release-jars/input/yandex-mcp-tracker.jar
          cp "yandex-mcp-workspace-wiki/target/yandex-mcp-workspace-wiki-${RELEASE_VERSION}.jar" \
            dist/release-jars/input/yandex-mcp-wiki.jar
          cp "yandex-mcp-workspace-tracker/target/yandex-mcp-workspace-tracker-${RELEASE_VERSION}.jar" \
            "dist/release-jars/assets/yandex-mcp-workspace-tracker-${RELEASE_VERSION}.jar"
          cp "yandex-mcp-workspace-wiki/target/yandex-mcp-workspace-wiki-${RELEASE_VERSION}.jar" \
            "dist/release-jars/assets/yandex-mcp-workspace-wiki-${RELEASE_VERSION}.jar"

      - name: Attest release JARs
        uses: actions/attest@v4
        with:
          subject-path: dist/release-jars/assets/*.jar

      - name: Upload Maven-layout JARs for Docker
        uses: actions/upload-artifact@v4
        with:
          name: jars
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: |
            yandex-mcp-workspace-tracker/target/yandex-mcp-workspace-tracker-*.jar
            yandex-mcp-workspace-wiki/target/yandex-mcp-workspace-wiki-*.jar

      - name: Upload normalized JARs for native packaging
        uses: actions/upload-artifact@v4
        with:
          name: release-jars
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: dist/release-jars

  native:
    needs: build
    name: Native ${{ matrix.classifier }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            classifier: linux-x64
          - os: ubuntu-24.04-arm
            classifier: linux-arm64
          - os: macos-15-intel
            classifier: macos-x64
          - os: macos-15
            classifier: macos-arm64
          - os: windows-latest
            classifier: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21 with jpackage
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist/release-jars

      - name: Build Unix portable package
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          scripts/package-release.sh \
            "${RELEASE_VERSION}" \
            "${CLASSIFIER}" \
            dist/release-jars/input/yandex-mcp-tracker.jar \
            dist/release-jars/input/yandex-mcp-wiki.jar \
            dist/native

      - name: Build Windows portable package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          CLASSIFIER: ${{ matrix.classifier }}
        run: |
          ./scripts/package-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Classifier $env:CLASSIFIER `
            -TrackerJar dist/release-jars/input/yandex-mcp-tracker.jar `
            -WikiJar dist/release-jars/input/yandex-mcp-wiki.jar `
            -OutputDir dist/native

      - name: Attest portable package
        uses: actions/attest@v4
        with:
          subject-path: dist/native/*

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.classifier }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          path: dist/native/*

  docker:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - module: yandex-mcp-workspace-tracker
            suffix: tracker
          - module: yandex-mcp-workspace-wiki
            suffix: wiki
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: jars
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.build.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.build.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.build.outputs.version, '-') }}

      - name: Build and push Docker image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: MCP_MODULE=${{ matrix.module }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=runtime-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.suffix }}

      - name: Attest Docker image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.suffix }}
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [build, native, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download release JARs
        uses: actions/download-artifact@v4
        with:
          name: release-jars
          path: dist/release-jars

      - name: Download portable packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/release
          merge-multiple: true

      - name: Collect JARs and generate checksums
        shell: bash
        run: |
          cp dist/release-jars/assets/*.jar dist/release/
          cd dist/release
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && needs.build.outputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
